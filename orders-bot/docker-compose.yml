services:
  bot:
    build: .
    env_file: .env
    # У хостинга часть IP Telegram недоступна, а IPv6 нет — закрепляем рабочий адрес API.
    # Если бот перестанет подключаться: проверить IP командой из README («Telegram недоступен»).
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    environment:
      DB_URL: sqlite+aiosqlite:///data/bot.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - bot-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  bot-data:
  redis-data:
